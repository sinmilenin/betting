name: form-and-xg
on:
  workflow_dispatch:                 # runs only when started by hand ("Run workflow" button, or by Claude on request)
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clear yesterday's results
        run: rm -f out/*.txt
      - name: Fetch form, xG and tables (matches.txt if it has matches, otherwise the day's slate)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python run.py --no-matchbook --xg 10 --slate --slate-hours 30
      - name: Save results into the repository
        run: |
          git config user.name "betting-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A out
          git commit -m "Form and xG $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "nothing new"
          git push
